<div class="page-header">
  <h2 class="page-title">إدارة العملاء</h2>
  <div class="page-actions">
    <button class="btn" (click)="toggleForm()">
      @if (showForm()) { إلغاء } @else { إضافة عميل جديد + }
    </button>
  </div>
</div>

@if (showForm()) {
  <div class="form-card">
    <h3>إضافة عميل جديد</h3>
    <form [formGroup]="clientForm" (ngSubmit)="onSubmit()" class="system-form">
      <div class="form-group">
        <label>اسم العميل</label>
        <input type="text" formControlName="name" placeholder="أدخل اسم العميل">
      </div>
      <div class="form-group">
        <label>رقم الهاتف</label>
        <input type="text" formControlName="phone" placeholder="أدخل رقم الهاتف">
      </div>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" formControlName="email" placeholder="أدخل البريد الإلكتروني">
      </div>
      <button type="submit" class="btn" [disabled]="!clientForm.valid">حفظ العميل</button>
    </form>
  </div>
}

<div class="recent-section">
  <div class="table-container">
    <table class="system-table">
      <thead>
        <tr>
          <th>اسم العميل</th>
          <th>رقم الهاتف</th>
          <th>البريد الإلكتروني</th>
          <th>تاريخ الإضافة</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody>
        @for (client of dataService.clients(); track client.id) {
          <tr>
            <td>{{ client.name }}</td>
            <td>{{ client.phone }}</td>
            <td>{{ client.email }}</td>
            <td>{{ client.dateAdded }}</td>
            <td><button class="btn-outline" style="padding: 5px 10px; font-size: 0.8rem;">تعديل</button></td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" style="text-align: center; padding: 20px;">لا يوجد عملاء حالياً.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
