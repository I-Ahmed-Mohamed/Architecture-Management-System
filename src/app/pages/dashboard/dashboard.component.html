<!-- Search Bar -->
<div class="grid-search-wrapper">
  <div class="grid-search">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
    <input type="text" placeholder="ابحث في النظام بالكامل..." (input)="onSearch($event)">
  </div>
</div>

<!-- App Grid -->
<div class="app-grid">
  @for (module of filteredModules(); track module.id) {
    <a [routerLink]="module.link" class="app-item">
      <div class="app-squircle" [style.backgroundColor]="module.color">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="module.icon" />
        </svg>
      </div>
      <span class="app-title">{{ module.title }}</span>
    </a>
  } @empty {
    <div class="no-results">
      <p>لا توجد نتائج للبحث</p>
    </div>
  }
</div>
