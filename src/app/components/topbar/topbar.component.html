<div class="topbar">
  <!-- Right Side: Menu Button + Logo -->
  <div class="topbar-brand">
    <button class="menu-btn" (click)="onMenuClick()" title="القائمة">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    @if (showBackButton()) {
      <button class="action-btn back-btn" (click)="goBack()" title="رجوع">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    }

    <div class="brand-logo">
      <img src="assets/logo.jpg" alt="Nest Designs" class="brand-img">
      <span class="brand-text">Nest Designs</span>
    </div>
  </div>

  <!-- Center: Search Bar -->
  <div class="search-container">
    <div class="search-bar">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="search-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input type="text" placeholder="ابحث عن مشروع، عميل..." (input)="onSearch($event)" (blur)="closeSearch()">
    </div>

    @if (showResults() && searchResults().length > 0) {
      <div class="search-results glass-dropdown">
        @for (result of searchResults(); track result.id) {
          <a [routerLink]="result.link" class="search-item">
            <div class="item-icon" [class]="result.type">
              {{ result.type === 'project' ? '🏗️' : '👥' }}
            </div>
            <div class="item-info">
              <span class="item-name">{{ result.name }}</span>
              <span class="item-sub">{{ result.type === 'project' ? result.clientName : result.phone }}</span>
            </div>
          </a>
        }
      </div>
    }
  </div>

  <!-- Left Side: Actions -->
  <div class="topbar-actions">
    <button class="action-btn notifications">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <span class="badge">3</span>
    </button>

    <div class="user-profile">
      <div class="avatar">م</div>
    </div>
  </div>
</div>
