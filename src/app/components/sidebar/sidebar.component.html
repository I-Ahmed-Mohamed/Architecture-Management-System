<div class="sidebar">

    <div class="brand-logo" style="display: flex; align-items: center; gap: 10px;">
      <img src="assets/logo.jpg" alt="Nest Designs Logo" style="width: 40px; height: 40px; border-radius: 12px; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);">
      <span class="brand-text" style="font-weight: 700; background: linear-gradient(135deg, #FFD700, #FDB931); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Nest Designs</span>
    </div>
  </div>
  
  <ul class="nav-menu">
    <li>
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link" [routerLinkActiveOptions]="{exact: true}">

    </li>
    <li>
      <a routerLink="/clients" routerLinkActive="active" class="nav-link">

          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />

          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
